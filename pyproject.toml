[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparseengine"
version = "0.1.0"
description = "A sparse-first inference engine for long-context LLM serving"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Sparse-Engine Team"}
]
dependencies = [
    "fire",
    "transformers>=5.13,<6",
    "socksio>=1,<2",
    "ninja",
    "triton>=3.5,<4",
    "tilelang==0.1.9",
    "apache-tvm-ffi==0.1.10",
    "nvidia-cutlass-dsl>=4.6,<5",
    "pillow",
    "torchvision",
    "einops",
    "sglang-kernel==0.4.5",
    "tqdm",
    "loguru",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2",
    "accelerate",
    "datasets",
    "wandb",
    "bitsandbytes",
    "datatrove",
    "matplotlib",
    "seaborn",
    "math-verify==0.9.0",
    "fuzzywuzzy",
    "jieba",
    "pytest",
    "rouge",
    "setproctitle>=1.3,<2",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
deepepv1 = [
    "deep-ep @ git+https://github.com/deepseek-ai/DeepEP.git@9af0e0d0e74f3577af1979c9b9e1ac2cad0104ee",
    "nvidia-ml-py>=12",
]
cu129 = [
    "torch==2.11.0",
    "flashinfer-python[cu12]>=0.6.15,<0.7",
    "flashinfer-cubin>=0.6.15,<0.7",
]
cu130 = [
    "torch==2.11.0",
    "flashinfer-python[cu13]>=0.6.15,<0.7",
    "flashinfer-cubin>=0.6.15,<0.7",
]

[project.scripts]
sparseengine-openai-server = "sparseengine.entrypoints.openai.api_server:main"
sparseengine-openai-router = "sparseengine.entrypoints.openai.smart_router:main"
sparseengine-openai-client = "sparseengine.entrypoints.openai.client:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparseengine*"]

[tool.setuptools.package-data]
sparseengine = [
    "configs/profiles/*.json",
    "kernels/triton/profiles/*.json",
    "operators/profiles/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [
    [
        { extra = "cu129" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", extra = "cu129" },
    { index = "pytorch-cu130", extra = "cu130" },
]
flashinfer-cubin = { index = "flashinfer" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true
